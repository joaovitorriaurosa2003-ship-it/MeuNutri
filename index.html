<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MeuNutri Cozinha</title><meta name="theme-color" content="#1F4D3A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E0A526'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Georgia' font-weight='700' text-anchor='middle' fill='%231F4D3A'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--verde:#1F4D3A;--verde2:#2E6B52;--verde-cl:#E3EEE7;--mostarda:#E0A526;--mostarda-cl:#FBF0D5;--creme:#F7F4EC;--papel:#FFFDF8;--linha:#E4DED0;--terra:#C2553A;--terra-cl:#F8E3DC;--ink:#1E2A24;--muted:#6B746E;--r:12px;--sombra:0 1px 2px rgba(30,42,36,.06),0 4px 16px rgba(30,42,36,.06)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--creme);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}h1{font-size:28px}h2{font-size:20px}h3{font-size:17px;margin-bottom:8px}h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
p{margin:6px 0}button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.alerta{color:var(--terra);font-weight:600}.verde{color:var(--verde2)}.terra{color:var(--terra)}.forte{font-weight:600}.flex1{flex:1}.mt{margin-top:12px}.p8{padding:8px}.w80,.input.w80{width:84px}.w-auto{width:auto}
.ic{flex:none}
/* layout */
.app{display:flex;min-height:100vh}
.lateral{width:236px;flex:none;background:var(--verde);color:#EAF2EC;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.lateral .logo{color:#fff;padding:0 8px 14px}.lateral nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:9px;text-align:left;color:#D6E5DA;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}.nav-item.ativo{background:var(--mostarda);color:var(--ink)}
.lateral .seletor-cozinha{margin:0 4px 12px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}.lateral .seletor-cozinha option{color:var(--ink)}
.lateral-pe{border-top:1px solid rgba(255,255,255,.14);padding-top:10px;margin-top:10px}.usuario{display:flex;flex-direction:column;padding:4px 12px 8px;font-size:13px}.usuario span{color:#AFC6B6;overflow:hidden;text-overflow:ellipsis}
.conteudo{flex:1;min-width:0}
.pagina{max-width:1080px;margin:0 auto;padding:28px 28px 60px}.pagina-larga{max-width:none}
.pagina-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px}.logo-marca{width:34px;height:34px;border-radius:10px;background:var(--mostarda);color:var(--verde);display:grid;place-items:center;font:700 19px Fraunces,serif}
.logo-txt{font:600 18px Fraunces,serif;display:flex;flex-direction:column;line-height:1.05}.logo-txt small{font:500 11px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.topo-mobile,.nav-baixo,.lateral-fundo{display:none}
.faixa-demo{background:var(--mostarda-cl);color:#6d5210;font-size:13px;padding:6px 16px;text-align:center}
/* componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:8px 14px;border:1px solid var(--linha);background:var(--papel);font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{border-color:#cfc6b2}.btn:disabled{opacity:.55;cursor:default}
.btn-primario{background:var(--verde);border-color:var(--verde);color:#fff}.btn-primario:hover{background:var(--verde2)}
.btn-secundario{background:var(--mostarda-cl);border-color:#ecd28f;color:#5a440c}.btn-perigo{background:var(--terra-cl);border-color:#ecbcae;color:#8f3622}.largo{width:100%}
.icone-btn{border:0;background:none;width:36px;height:36px;border-radius:9px;display:inline-grid;place-items:center;color:var(--ink)}.icone-btn:hover{background:rgba(30,42,36,.07)}
.icone-btn.verde{color:var(--verde2)}.icone-btn.terra{color:var(--terra)}
.link{border:0;background:none;padding:0;color:var(--verde2);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.input{width:100%;border:1px solid var(--linha);background:#fff;border-radius:9px;padding:8px 11px;min-height:38px;outline:none}.input:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(46,107,82,.15)}
textarea.input{resize:vertical}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.campo-label{font-size:12.5px;font-weight:600;color:#45514A}.campo-dica{font-size:12px;color:var(--muted)}
.campo-inline{flex-direction:row;align-items:center;gap:8px;margin:0}
.form-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.span2{grid-column:span 2}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:18px;box-shadow:var(--sombra);margin-bottom:16px}
.cartao.destaque{background:linear-gradient(135deg,#FFF8E6,#FFFDF8);border-color:#ecd28f}.cartao-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.estreito{max-width:420px}
.grade-cartoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;margin:0}.kpi:hover{border-color:#cfc6b2}
.kpi-rot{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:block}
.kpi-num{font:600 30px Fraunces,serif;color:var(--verde)}.kpi-num.alerta{color:var(--terra)}
.barra{height:6px;background:var(--linha);border-radius:4px;overflow:hidden;margin-top:8px}.barra div{height:100%;background:var(--verde2);transition:width .3s}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#EFEBE0;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;white-space:nowrap}
.tag-ok{background:var(--verde-cl);color:var(--verde)}.tag-aviso{background:var(--mostarda-cl);color:#7a5a0c}
.mov-entrada{background:var(--verde-cl);color:var(--verde)}.mov-saida,.mov-producao{background:var(--terra-cl);color:#8f3622}.mov-contagem{background:#E6ECF5;color:#2b4a72}.mov-estorno{background:var(--mostarda-cl);color:#7a5a0c}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--linha);background:var(--papel);border-radius:20px;padding:5px 12px;font-size:13px}.chip.ativo{background:var(--verde);border-color:var(--verde);color:#fff}
.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--linha);background:#fff;border-radius:9px;padding:0 11px;flex:1;min-width:200px}.busca input{border:0;outline:0;flex:1;min-height:38px;background:none}
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.check{display:inline-flex;align-items:center;gap:7px;font-size:14px}
.contagem{font-size:13px}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:block;width:100%;text-align:left;background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:11px 14px}button.item:hover{border-color:#cfc6b2}
.item-acoes{display:flex;align-items:center;gap:8px}.item-corpo{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0}
.item-tit{font-weight:600}.item-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;margin-top:3px}
.ver-mais{display:flex;justify-content:center;padding:10px}
.vazio{text-align:center;padding:36px 16px;color:var(--muted)}.vazio-titulo{font:600 18px Fraunces,serif;color:var(--ink);margin-bottom:4px}.vazio .acoes{justify-content:center;margin-top:12px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aviso{background:var(--mostarda-cl);border:1px solid #ecd28f;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}.aviso .ic{vertical-align:-3px;margin-right:4px}
.linha-simples{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--linha);font-size:14px}
.seg{display:inline-flex;background:#ECE7DA;border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:500;font-size:14px}.seg button.ativo{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg-largo{display:flex}.seg-largo button{flex:1}
.leitor-modo button.ativo.m-entrada{background:var(--verde);color:#fff}.leitor-modo button.ativo.m-saida{background:var(--terra);color:#fff}.leitor-modo button.ativo.m-contagem{background:#2b4a72;color:#fff}
.tabela{width:100%;border-collapse:collapse;font-size:14px}.tabela th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--linha)}.tabela td{padding:7px 8px;border-bottom:1px solid #EFEADF}.num{text-align:right;white-space:nowrap}
.total{display:flex;align-items:center;gap:14px;justify-content:flex-end}.total strong{font:600 24px Fraunces,serif;color:var(--verde)}
/* modal */
.modal-fundo{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.modal{background:var(--papel);border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:90vh}.modal-largo{max-width:820px}
.modal-topo{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--linha)}.modal-corpo{padding:16px 18px;overflow:auto}.modal-rodape{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--linha);flex-wrap:wrap}
.lista-escolha{max-height:46vh;overflow:auto;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.escolha{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--linha);background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:4px}.escolha:hover{border-color:var(--verde2)}.escolha.ja{background:var(--verde-cl)}.escolha .muted{font-size:12.5px;text-align:right}
.seletor{position:relative;flex:1;min-width:160px}.seletor-botao{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seletor-pop{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--linha);border-radius:10px;box-shadow:var(--sombra);padding:8px;min-width:240px}
.seletor-lista{max-height:240px;overflow:auto;margin-top:6px}.seletor-item{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:7px;font-size:14px}.seletor-item:hover{background:var(--verde-cl)}.seletor-item.criar{color:var(--verde2);font-weight:600;display:flex;gap:6px;align-items:center}
.qtd{display:flex;min-width:150px}.qtd input{width:100%;min-width:0;border:1px solid var(--linha);border-right:0;border-radius:9px 0 0 9px;padding:8px 10px;min-height:38px;background:#fff}.qtd select,.qtd-un{border:1px solid var(--linha);border-radius:0 9px 9px 0;background:#F3EFE5;padding:0 8px;min-height:38px;display:grid;place-items:center}
.componentes{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.comp-linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FAF7F0;border:1px solid #EFEADF;border-radius:10px;padding:8px}
.calc{margin-top:16px;background:#FAF7F0;border-radius:10px;padding:12px}.calc-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.calc-topo h4{margin:0}
.resumo{display:flex;flex-wrap:wrap;gap:8px 22px;margin:10px 0}.resumo strong{font:600 18px Fraunces,serif;color:var(--verde)}.resumo-nota{width:100%;font-size:12.5px}
.ficha-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:14px}.pre{white-space:pre-wrap}
.tags-linha{display:flex;flex-wrap:wrap;margin-bottom:8px}.chip-x{border:0;background:none;padding:0 0 0 2px;display:inline-grid;place-items:center;color:inherit;opacity:.6}.chip-x:hover{opacity:1}
.link-copia{display:flex;gap:8px}
.stepper{display:flex;gap:6px}.stepper button{width:42px;border:1px solid var(--linha);background:#fff;border-radius:9px;font-size:20px}.stepper input{text-align:center}
/* cardápio */
.semana-nav{display:flex;align-items:center;gap:6px}.semana-rot{font-weight:600;min-width:170px;text-align:center}
.barra-acoes{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.barra-acoes .seg{margin:0}.barra-acoes .acoes{margin-left:auto}
.grade-wrap{overflow:auto;background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.grade{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;font-size:13.5px}
.grade thead th{position:sticky;top:0;background:var(--verde);color:#fff;padding:10px 8px;font-weight:500;text-align:left;vertical-align:top;z-index:1}
.dia-nome{font:600 15px Fraunces,serif}.dia-data{font-size:12px;opacity:.75;margin-bottom:6px}
.input.coz{min-height:30px;padding:4px 8px;font-size:13px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}.input.coz::placeholder{color:rgba(255,255,255,.6)}
.grade td,.grade tbody th{border-bottom:1px solid #EFEADF;border-right:1px solid #F3EFE5;vertical-align:top;padding:6px}
.col-slot{width:118px;background:#FAF7F0;text-align:left;position:sticky;left:0;z-index:1}.grade thead .col-slot{background:var(--verde);z-index:2}
.grupo-ini td,.grupo-ini th{border-top:2px solid var(--linha)}.grupo-nome{font:600 14px Fraunces,serif;color:var(--verde)}.slot-nome{font-size:12px;color:var(--muted);font-weight:500}
.celula{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start;min-height:30px}
.prep-chip{display:inline-flex;align-items:center;gap:4px;background:#F2EEE3;border-radius:7px;padding:4px 6px 4px 8px;line-height:1.25}.prep-chip.feito{background:var(--verde-cl);color:var(--verde)}
.ponto{width:7px;height:7px;border-radius:50%;background:var(--mostarda);flex:none}
.add-slot{border:1px dashed #cfc6b2;background:none;border-radius:7px;width:28px;height:26px;display:grid;place-items:center;color:var(--muted)}.add-slot:hover{border-color:var(--verde2);color:var(--verde2)}
.prod-item{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linha);border-radius:8px;padding:5px 8px;width:100%;cursor:pointer}.prod-item input{width:18px;height:18px;accent-color:var(--verde2)}.prod-item.feito{background:var(--verde-cl);border-color:#b9d4c3;text-decoration:line-through;color:var(--verde)}
.linha-kcal td{font-size:12px;color:var(--muted);text-align:right;background:#FCFAF5}.linha-kcal td.fora{color:var(--terra);font-weight:600}
.dias-tabs{display:flex;gap:4px;overflow:auto;margin-bottom:12px}.dias-tabs button{flex:1;min-width:52px;border:1px solid var(--linha);background:var(--papel);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:14px}.dias-tabs button small{font-weight:400;font-size:11px;color:var(--muted)}.dias-tabs button.ativo{background:var(--verde);color:#fff;border-color:var(--verde)}.dias-tabs button.ativo small{color:#cfe0d5}
.dia-mobile{display:flex;flex-direction:column;gap:10px}.dia-cab{display:flex;gap:10px;align-items:center}.dia-cab strong{font:600 18px Fraunces,serif}
.grupo-mob{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:12px}.grupo-tit{font:600 15px Fraunces,serif;color:var(--verde);display:flex;justify-content:space-between;margin-bottom:6px}.kcal{font:500 12px Inter,sans-serif;color:var(--muted)}
.slot-mob{padding:6px 0;border-top:1px dashed var(--linha)}.slot-mob:first-of-type{border-top:0}.slot-rot{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.hoje{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.hoje-linha{display:flex;gap:10px;align-items:baseline;font-size:14px}.hoje-slot{width:170px;flex:none;color:var(--muted);font-size:13px}
.so-print{display:none}
/* estoque e leitor */
.saldo{font-weight:700;font-size:15px}.min-edit{display:inline-flex;align-items:center;gap:6px}.acoes-mini{display:flex;gap:2px}
.mov{display:flex;align-items:center;gap:10px;background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:9px 12px}.mov-corpo{flex:1;display:flex;flex-direction:column;min-width:0;font-size:14px}.mov-corpo .muted{font-size:12.5px}.mov-num{display:flex;flex-direction:column;align-items:flex-end;font-size:13px;font-weight:600}
.leitor-grade{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.leitor-cam{width:100%;aspect-ratio:4/3;background:#17231d;border-radius:10px;overflow:hidden;margin-bottom:10px;position:relative}.leitor-cam video{width:100%!important;height:100%!important;object-fit:cover}
.cam-off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9fb7a8}
.input-grande{font-size:22px;letter-spacing:.06em;min-height:52px}
/* toasts */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;animation:sobe .2s}.toast-erro{background:var(--terra)}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
/* acesso */
.centro{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}.centro .logo{justify-content:center;margin-bottom:12px}
.acesso{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.acesso-lado{background:var(--verde);color:#EAF2EC;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px}.acesso-lado .logo{color:#fff}.acesso-lado h1{font-size:38px;color:#fff;max-width:520px;line-height:1.15}.acesso-lado p{max-width:460px;color:#C5D8CB}
.acesso-form{align-self:center;justify-self:center;width:min(380px,90vw);padding:30px 0}.acesso-form h2{margin-bottom:16px}.acesso-links{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:14px;flex-wrap:wrap}.msg{color:var(--terra);font-size:14px}
/* página pública */
.publico{max-width:1300px;margin:0 auto;padding:24px 20px}.publico.embed{padding:12px;background:transparent}.pub-topo{margin-bottom:16px;color:var(--verde)}
.pub-cab{margin-bottom:16px}.pub-cab p{color:var(--muted)}
.pub-semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.pub-dia{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}.pub-dia-cab{background:var(--verde);color:#fff;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline}.pub-dia-cab strong{font-family:Fraunces,serif}.pub-dia-cab span{font-size:12px;opacity:.8}
.pub-grupo{padding:8px 10px;border-top:1px solid #EFEADF}.pub-grupo:first-of-type{border-top:0}.pub-grupo-tit{font:600 13px Fraunces,serif;color:var(--verde);margin-bottom:3px}.pub-linha{font-size:13px;display:flex;flex-direction:column;margin-bottom:3px}.pub-linha .muted{font-size:11px}
/* responsivo */
@media (max-width:1100px){.grade-cartoes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{display:block}
  .lateral{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s}.lateral.aberta{transform:none}
  .lateral-fundo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
